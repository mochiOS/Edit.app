name = "Edit"
bundle_id = "org.mochios.edit"
version = "0.1.0"
developer = "mochiOS"
entry = "entry.elf"
description = "Plain text editor"
icon = "appicon.png"

resources = [
    "appicon.png",
    "control-center.toml",
]

document_roles = ["view", "edit"]
document_content_types = [
    "text/plain",
    "application/json",
    "application/toml",
    "application/xml",
    "text/csv",
    "text/markdown",
    "text/x-c",
    "text/x-c++",
    "text/x-rust",
    "text/x-shellscript",
    "text/yaml",
]
document_extensions = [
    "txt",
    "text",
    "md",
    "markdown",
    "json",
    "toml",
    "xml",
    "csv",
    "yaml",
    "yml",
    "log",
    "ini",
    "conf",
    "cfg",
    "c",
    "h",
    "cc",
    "cpp",
    "cxx",
    "hh",
    "hpp",
    "rs",
    "sh",
]
