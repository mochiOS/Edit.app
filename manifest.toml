format = 1

[package]
provenance = "built-in"
id = "org.mochios.edit"
name = "Edit"
version = "0.1.0"
revision = 1
vendor = "mochiOS"
kind = "application"
architecture = "x86_64"
abi = "mochios-1"

[application]
entry = "entry.elf"
description = "Plain text editor"
icon = "appicon.png"
resources = [
    "appicon.png", "icons/text.svg", "icons/c.svg", "icons/cpp.svg",
    "icons/rust.svg", "icons/markdown.svg", "icons/json.svg",
]
document_icon = "icons/text.svg"
document_roles = ["view", "edit"]
document_content_types = [
    "text/plain",
    "application/json",
    "application/toml",
    "application/xml",
    "text/csv",
    "text/markdown",
    "text/x-c",
    "text/x-c++",
    "text/x-rust",
    "text/x-shellscript",
    "text/yaml",
]
document_extensions = [
    "txt", "text", "md", "markdown", "json", "toml", "xml", "csv",
    "yaml", "yml", "log", "ini", "conf", "cfg", "c", "h", "cc",
    "cpp", "cxx", "hh", "hpp", "rs", "sh",
]

[[application.document_icons]]
extensions = ["c", "h"]
content_types = ["text/x-c"]
resource = "icons/c.svg"

[[application.document_icons]]
extensions = ["cc", "cpp", "cxx", "hh", "hpp"]
content_types = ["text/x-c++"]
resource = "icons/cpp.svg"

[[application.document_icons]]
extensions = ["rs"]
content_types = ["text/x-rust"]
resource = "icons/rust.svg"

[[application.document_icons]]
extensions = ["md", "markdown"]
content_types = ["text/markdown"]
resource = "icons/markdown.svg"

[[application.document_icons]]
extensions = ["json"]
content_types = ["application/json"]
resource = "icons/json.svg"

[[application.control_center_items]]
id = "open-edit"
title = "Edit"
symbol = "pencil"
action = "open-application"

[[binary]]
path = "/system/applications/Edit.app/entry.elf"
kind = "application"
requires = [
    "ipc.client",
    "ipc.server",
    "window.create",
    "fs.read.user",
    "fs.write.user",
    "clipboard.read",
    "clipboard.write",
]
